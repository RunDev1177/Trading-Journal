<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal - บันทึกการเทรด</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="tradingicon.ico">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0fdf4; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .green-gradient { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0fdf4; }
        ::-webkit-scrollbar-thumb { background: #86efac; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4ade80; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header -->
    <header class="green-gradient text-white py-10 shadow-lg mb-8">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-2">🌿 Trading Journal</h1>
            <p class="text-lg opacity-90">บันทึกวินัยและการเติบโตของการเทรด</p>
        </div>
    </header>

    <main class="container mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Form Section -->
            <section class="lg:col-span-1">
                <button id="openFormBtn" onclick="toggleForm(true)" class="w-full green-gradient text-white font-bold py-6 rounded-2xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 active:scale-95 flex flex-col items-center justify-center gap-2">
                    <span class="text-3xl">➕</span>
                    <span>เพิ่มบันทึกการเทรด</span>
                </button>

                <div id="formBox" class="hidden glass-card rounded-2xl p-6 shadow-md sticky top-6 fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="formTitle" class="text-xl font-bold text-green-800 flex items-center">
                            <span class="bg-green-100 p-2 rounded-lg mr-3">📝</span> บันทึกเทรดใหม่
                        </h2>
                        <button onclick="toggleForm(false)" class="text-gray-400 hover:text-gray-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    
                    <form id="journalForm" class="space-y-4">
                        <!-- ID อ้างอิง -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 uppercase tracking-widest text-[10px]">Reference ID</label>
                            <input type="text" id="displayId" readonly class="w-full bg-gray-50 text-gray-400 text-xs px-3 py-1 rounded border-none outline-none italic" placeholder="Auto-generated ID">
                            <input type="hidden" id="editId">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700">1. วันที่/เวลา (ตั้งแผน)</label>
                                <input type="datetime-local" id="datetime" required class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">2. สินทรัพย์</label>
                                <input type="text" id="asset" placeholder="เช่น BTC, Gold" required class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">3. ประเภท</label>
                                <select id="type" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                                    <option value="Buy/Long">Buy / Long</option>
                                    <option value="Sell/Short">Sell / Short</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">4. ราคาที่ตั้ง (Limit)</label>
                            <input type="number" step="any" id="price" placeholder="0.00" required class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">5. สาเหตุ/Setup</label>
                            <textarea id="setup" rows="2" placeholder="เหตุผลในการเข้าเทรด..." class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none"></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">6. สถานะ (Status)</label>
                                <select id="status" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                                    <option value="Pending">กำลังรอ</option>
                                    <option value="Active">✅ ติดออเดอร์</option>
                                    <option value="TP">💸 Take Profit</option>
                                    <option value="SL">🛑 Stop Loss</option>
                                    <option value="Canceled">✖️Canceled</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">7. อารมณ์</label>
                                <select id="emotion" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                                    <option value="🧘นิ่งๆ ตามแผน">🧘นิ่งๆ ตามแผน</option>
                                    <option value="😤เสียดาย/อยากไล่ราคา">😤เสียดาย/อยากไล่ราคา</option>
                                    <option value="Fear">🧐 กราฟเสียทรงเลยลบ</option>
                                    <option value="Greedy">โลภ</option>
                                    <option value="Bored">เบื่อ</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">8. Link รูปภาพ</label>
                            <input type="url" id="imgUrl" placeholder="https://..." class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
                        </div>

                        <div class="pt-4 flex gap-2">
                            <button type="submit" id="submitBtn" class="flex-1 green-gradient text-white font-semibold py-3 rounded-xl shadow-md hover:opacity-90 transition transform active:scale-95">บันทึกข้อมูล</button>
                            <button type="button" onclick="toggleForm(false)" class="flex-1 bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-300 transition">ยกเลิก</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Table/List Section -->
            <section class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-green-800 flex items-center">
                        <span class="mr-2">📊</span> ประวัติการเทรด
                    </h2>
                    <button onclick="fetchData()" class="bg-white border border-green-200 text-green-600 px-4 py-2 rounded-lg hover:bg-green-50 transition text-sm flex items-center shadow-sm">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        รีเฟรชข้อมูล
                    </button>
                </div>

                <div id="loading" class="hidden text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-500 border-t-transparent"></div>
                    <p class="mt-2 text-green-600">กำลังโหลดข้อมูล...</p>
                </div>

                <div id="noData" class="glass-card rounded-2xl p-12 text-center text-gray-400">
                    <p class="mb-2">ยังไม่มีข้อมูลบันทึกใน Journal</p>
                    <p class="text-xs">กรุณาตรวจสอบ SCRIPT_URL ในโค้ดหากไม่พบข้อมูล</p>
                </div>

                <div id="journalContainer" class="space-y-4">
                    <!-- Cards will be injected here -->
                </div>
            </section>
        </div>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiMkG0IhEinTvNlfFs6MntNrEGvRVkajcSdmxWaxgxjbSkYzrpXnG3tVl9cmOrxjld/exec"; 
        
        let currentData = [];

        function showToast(msg, colorClass) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `fixed bottom-10 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white shadow-2xl transition-opacity duration-300 pointer-events-none z-50 ${colorClass}`;
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 3000);
        }

        // ฟังก์ชันสร้างรหัส ID แบบ 20260508001
        function generateCustomId(data) {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const todayPrefix = `${yyyy}${mm}${dd}`;
            
            // หาเลขรันล่าสุดของวันนี้จากข้อมูลที่มีอยู่
            const todayEntries = data.filter(item => item.id && item.id.toString().startsWith(todayPrefix));
            let nextNum = 1;
            
            if (todayEntries.length > 0) {
                const lastIds = todayEntries.map(item => parseInt(item.id.toString().slice(-3)));
                nextNum = Math.max(...lastIds) + 1;
            }
            
            return `${todayPrefix}${String(nextNum).padStart(3, '0')}`;
        }

        function toggleForm(show) {
            const openFormBtn = document.getElementById('openFormBtn');
            const formBox = document.getElementById('formBox');
            
            if (show) {
                openFormBtn.classList.add('hidden');
                formBox.classList.remove('hidden');
                
                // ตั้งค่า ID และวันที่ปัจจุบันถ้าเป็นการเพิ่มใหม่
                if (!document.getElementById('editId').value) {
                    document.getElementById('displayId').value = generateCustomId(currentData);
                    const now = new Date();
                    const tzoffset = (now).getTimezoneOffset() * 60000;
                    document.getElementById('datetime').value = (new Date(now - tzoffset)).toISOString().slice(0, 16);
                }
            } else {
                openFormBtn.classList.remove('hidden');
                formBox.classList.add('hidden');
                resetForm();
            }
        }

        async function fetchData() {
            if (!SCRIPT_URL) return;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('journalContainer').innerHTML = '';
            document.getElementById('noData').classList.add('hidden');

            try {
                const response = await fetch(`${SCRIPT_URL}?action=read`);
                const data = await response.json();
                document.getElementById('loading').classList.add('hidden');
                if (data && data.length > 0) {
                    currentData = data;
                    renderJournal(data);
                } else {
                    currentData = [];
                    document.getElementById('noData').classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('noData').classList.remove('hidden');
                showToast('โหลดข้อมูลล้มเหลว', 'bg-red-500');
            }
        }

        function renderJournal(items) {
            const container = document.getElementById('journalContainer');
            container.innerHTML = '';
            [...items].reverse().forEach((item) => {
                const statusColors = {
                    'TP': 'bg-green-100 text-green-700', 'SL': 'bg-red-100 text-red-700',
                    'Pending': 'bg-yellow-100 text-yellow-700', 'Active': 'bg-blue-100 text-blue-700',
                    'Canceled': 'bg-gray-100 text-gray-700'
                };
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition border border-white fade-in';
                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <p class="text-[10px] text-gray-400 font-mono mb-1">ID: ${item.id}</p>
                                <h3 class="font-bold text-lg text-gray-800">${item.asset} <span class="text-sm font-normal text-gray-500 ml-2">(${item.type})</span></h3>
                                <p class="text-xs text-gray-400">${new Date(item.datetime).toLocaleString('th-TH')}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColors[item.status] || 'bg-gray-100'}">
                                ${item.status}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <p class="text-xs text-gray-500 uppercase tracking-wider">Price</p>
                                <p class="font-medium text-gray-700">${item.price ? parseFloat(item.price).toLocaleString() : '0'}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 uppercase tracking-wider">Emotion</p>
                                <p class="font-medium text-gray-700">${item.emotion || '-'}</p>
                            </div>
                        </div>
                        <div class="bg-green-50/50 p-3 rounded-lg mb-4 border border-green-100/50">
                            <p class="text-xs text-green-600 font-semibold mb-1 uppercase">Setup:</p>
                            <p class="text-sm text-gray-700 italic">"${item.setup || '-'}"</p>
                        </div>
                        ${item.imgUrl ? `
                            <div class="mb-4 rounded-xl overflow-hidden border border-gray-100 group relative">
                                <img src="${item.imgUrl}" alt="Chart" class="w-full h-40 object-cover group-hover:opacity-90 transition cursor-zoom-in" onerror="this.parentElement.style.display='none'">
                                <a href="${item.imgUrl}" target="_blank" class="absolute top-2 right-2 bg-black/50 text-white p-1 rounded-md opacity-0 group-hover:opacity-100 transition">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </div>
                        ` : ''}
                        <div class="flex justify-end gap-2 pt-2 border-t border-gray-0">
                            <button onclick="prepareEdit('${item.id}')" class="text-blue-500 hover:bg-blue-50 px-3 py-1 rounded-md text-sm transition">แก้ไข</button>
                            <button onclick="deleteEntry('${item.id}')" class="text-red-500 hover:bg-red-50 px-3 py-1 rounded-md text-sm transition">ลบ</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function prepareEdit(id) {
            const item = currentData.find(i => i.id.toString() === id.toString());
            if (!item) return;

            toggleForm(true);

            // ใช้ ID เดิมเป็นหลักในการแก้ไข
            document.getElementById('editId').value = item.id;
            document.getElementById('displayId').value = item.id;
            
            if (item.datetime) {
                const date = new Date(item.datetime);
                const tzoffset = (new Date()).getTimezoneOffset() * 60000;
                const localISOTime = (new Date(date - tzoffset)).toISOString().slice(0, 16);
                document.getElementById('datetime').value = localISOTime;
            }

            document.getElementById('asset').value = item.asset || '';
            document.getElementById('type').value = item.type || 'Buy/Long';
            document.getElementById('price').value = item.price || '';
            document.getElementById('setup').value = item.setup || '';
            document.getElementById('status').value = item.status || 'Pending';
            document.getElementById('emotion').value = item.emotion || 'Normal';
            document.getElementById('imgUrl').value = item.imgUrl || '';

            document.getElementById('formTitle').innerHTML = '<span class="bg-blue-100 p-2 rounded-lg mr-3">✏️</span> แก้ไขรายการ';
            document.getElementById('submitBtn').textContent = 'อัปเดตข้อมูล';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const form = document.getElementById('journalForm');
        form.onsubmit = async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const displayId = document.getElementById('displayId').value;
            
            // ถ้ามี editId แสดงว่าเป็นโหมดแก้ไข ให้ใช้ค่านั้นเลย ถ้าไม่มีแสดงว่าเป็นโหมดสร้างใหม่ ให้ใช้ค่าจาก displayId
            const finalId = editId || displayId; 
            const action = editId ? 'update' : 'create';

            const payload = {
                action: action, id: finalId,
                datetime: document.getElementById('datetime').value,
                asset: document.getElementById('asset').value,
                type: document.getElementById('type').value,
                price: document.getElementById('price').value,
                setup: document.getElementById('setup').value,
                status: document.getElementById('status').value,
                emotion: document.getElementById('emotion').value,
                imgUrl: document.getElementById('imgUrl').value
            };

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin inline-block mr-2">⏳</span> กำลังบันทึก...`;

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast(action === 'update' ? 'แก้ไขข้อมูลสำเร็จ!' : 'บันทึกข้อมูลแล้ว!', 'bg-green-600');
                toggleForm(false);
                fetchData();
            } catch (error) {
                showToast('เกิดข้อผิดพลาด', 'bg-red-500');
            } finally {
                btn.disabled = false;
                btn.textContent = editId ? 'อัปเดตข้อมูล' : 'บันทึกข้อมูล';
            }
        };

        async function deleteEntry(id) {
            if (!confirm(`ยืนยันการลบรายการ ID: ${id}?`)) return;
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: id }) });
                showToast('ลบข้อมูลเรียบร้อย', 'bg-gray-700');
                fetchData();
            } catch (error) {
                showToast('ลบไม่สำเร็จ', 'bg-red-500');
            }
        }

        function resetForm() {
            form.reset();
            document.getElementById('editId').value = '';
            document.getElementById('displayId').value = '';
            document.getElementById('formTitle').innerHTML = '<span class="bg-green-100 p-2 rounded-lg mr-3">📝</span> บันทึกเทรดใหม่';
            document.getElementById('submitBtn').textContent = 'บันทึกข้อมูล';
        }

        window.onload = () => { fetchData(); };
    </script>
</body>
</html>
